# Deploy to GitHub Pages.
#
# DEPLOY_TO_GITHUB.md references this file, but it did not exist until now —
# that document was claiming a deploy pipeline that was never in the repo.
#
# One-time setup after the first push:
#   Settings > Pages > Build and deployment > Source: GitHub Actions
#
# The app has no client-side router (no react-router), so there is no SPA
# 404 fallback needed — a hard refresh on any path serves index.html only for
# "/", and there are no other paths.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run the deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let a running deploy finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `npm ci` installs exactly what package-lock.json pins. There is also a
        # bun.lock in the repo, but the Pages runner has no bun, and having two
        # lockfiles for the same tree is how they drift apart.
        run: npm ci

      - name: Typecheck
        # Run the same check as `npm run lint`. CI needs ~4 GB for tsc on this
        # file set; the default Node heap is not enough.
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4