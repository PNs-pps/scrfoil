# Deploy to GitHub Pages.
#
# DEPLOY_TO_GITHUB.md references this file, but it did not exist until now —
# that document was claiming a deploy pipeline that was never in the repo.
#
# One-time setup after the first push:
#   Settings > Pages > Build and deployment > Source: GitHub Actions
#
# The app has no client-side router (no react-router), so there is no SPA
# 404 fallback needed — a hard refresh on any path serves index.html only for
# "/", and there are no other paths.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run the deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Every `uses:` below is pinned to a full commit SHA with the tag in a trailing
# comment. A bare `@v4` is a mutable ref — anyone who can push a tag to the
# action repo changes what runs here with the repo's Pages write token. Bump
# deliberately: replace the SHA and update the comment together.

# Never run two deploys at once, and let a running deploy finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm ci` requires package-lock.json in the repo root.
        # Do not commit bun.lock alongside it — two lockfiles drift apart.
        run: npm ci

      - name: Typecheck
        # Run the same check as `npm run lint`. CI needs ~4 GB for tsc on this
        # file set; the default Node heap is not enough.
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test
        # Covers the snapshot-persistence and batch-reconcile paths that broke
        # silently before. Cheap enough to always run.
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4