# Deploy to GitHub Pages.
#
# One-time setup after the first push:
#   Settings > Pages > Build and deployment > Source: GitHub Actions
#
# The app has no client-side router (no react-router), so there is no SPA
# 404 fallback needed.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pin every `uses:` to a full commit SHA. Bump deliberately.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 20 LTS is more stable with npm ci on GH runners than 22
          # (avoids intermittent "Exit handler never called" crashes).
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm ci can hit a known npm CLI crash ("Exit handler never called")
        # on long installs. Retry once, then fall back to npm install.
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          npm config set maxsockets 10
          if ! npm ci --no-audit --no-fund; then
            echo "::warning::npm ci failed — falling back to npm install"
            rm -rf node_modules
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
