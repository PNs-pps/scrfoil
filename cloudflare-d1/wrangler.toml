# Cloudflare Worker + D1 for foil stock snapshot backup
# 1) npm i -g wrangler && wrangler login
# 2) wrangler d1 create scrfoil_cloundflare_d1
# 3) ใส่ database_id ด้านล่าง
# 4) wrangler d1 execute scrfoil_cloundflare_d1 --file=./schema.sql
# 5) ตั้ง secret: wrangler secret put BACKUP_SECRET
# 6) wrangler deploy

name = "foil-stock-d1-backup"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "scrfoil_cloundflare_d1"
database_id = "fe3073c1-bb21-479b-a354-b256aa26ec68"

[vars]
# อย่าใส่ secret จริงตรงนี้ — ใช้ wrangler secret put BACKUP_SECRET
APP_NAME = "scrfoil-backup"

# โปรเจกต์ Firebase ที่ยอมรับ ID token (คั่นด้วย , ) — ทั้ง 2 ตัวที่แอปสลับใช้ได้
FIREBASE_PROJECT_IDS = "stock-foil,xenon-airport-rlxdt"

# อีเมลพนักงานที่อนุญาต (คั่นด้วย , ) — ต้องตรงกับ isStaff() ใน firestore.rules
ALLOWED_EMAILS = "ikuyisad@ikwai.com"

# ใช้ Firebase token เท่านั้น (Worker นี้ไม่ได้ตั้ง BACKUP_SECRET)
# ถ้าต้องเปิดทางสำรองด้วย secret: wrangler secret put BACKUP_SECRET แล้วเปลี่ยนเป็น "0"
DISABLE_SECRET_AUTH = "1"
