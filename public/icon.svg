<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.3" />
  
  <!-- Layers Graphic (Metalsheet & PU Foam) -->
  <g transform="translate(96, 80) scale(1.35)">
    <!-- Top Layer (Metalsheet Wave) -->
    <path d="M120 18 L220 70 L120 122 L20 70 Z" fill="url(#amberGrad)" />
    <!-- Foam Middle Layer -->
    <path d="M20 70 L120 122 L120 152 L20 100 Z" fill="#92400e" />
    <path d="M220 70 L120 122 L120 152 L220 100 Z" fill="#b45309" />
    <!-- Foil Bottom Layer -->
    <path d="M20 115 L120 167 L120 197 L20 145 Z" fill="#f59e0b" opacity="0.9" />
    <path d="M220 115 L120 167 L120 197 L220 145 Z" fill="#fcd34d" opacity="0.9" />
  </g>

  <!-- Scissors Symbol Circle -->
  <circle cx="368" cy="368" r="88" fill="#f59e0b" stroke="#ffffff" stroke-width="8" />
  <g transform="translate(320, 320) scale(4)">
    <!-- Scissors Icon path -->
    <circle cx="6" cy="6" r="3" fill="none" stroke="#0f172a" stroke-width="2" />
    <circle cx="6" cy="18" r="3" fill="none" stroke="#0f172a" stroke-width="2" />
    <path d="M20 4 L8.12 15.88M14.47 14.48 L20 20M8.12 8.12 L12 12" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
